name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend/
      - name: Typecheck (mypy)
        run: mypy backend/
      - name: Tests
        run: pytest backend/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      # The repo ships bun.lock, not package-lock.json — `npm ci` can never work.
      - name: Install deps
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: frontend
      - name: Tests
        run: bunx vitest run
        working-directory: frontend
      - name: Build
        run: bunx vite build
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t svenska-tutor:ci .
