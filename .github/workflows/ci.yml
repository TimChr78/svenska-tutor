name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend/
      - name: Typecheck (mypy)
        run: mypy backend/
      - name: Tests
        run: pytest backend/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Tests
        run: npx vitest run
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t svenska-tutor:ci .
